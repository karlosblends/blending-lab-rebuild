<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blending Lab narrative scroll animation</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #f8f8f8; color: #171616; font-family: Inter, Arial, sans-serif; }
      .intro, .outro { min-height: 55vh; display: grid; place-items: center; padding: 2rem; text-align: center; }
      .intro h1 { max-width: 18ch; margin: 0; font-size: clamp(2.5rem, 7vw, 6rem); line-height: .94; letter-spacing: -.06em; }
      .scene { height: 280vh; position: relative; }
      .sticky { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; overflow: hidden; }
      .graphic { width: min(84vw, 920px); }
      .label { position: absolute; left: 2rem; bottom: 2rem; font-size: .8rem; color: #919191; }
      .bl-base-ring { fill: none; stroke: #2e2e2e; stroke-width: 2; vector-effect: non-scaling-stroke; }
      .bl-trace { fill: none; stroke: url(#bl-trace); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; vector-effect: non-scaling-stroke; }
      .bl-center-on { opacity: 0; }
      @media (max-width: 640px) {
        .graphic { width: 115vw; }
        .label { left: 1rem; bottom: 1rem; }
      }
    </style>
  </head>
  <body>
    <header class="intro"><h1>Five layers. One finished product.</h1></header>
    <section class="scene" data-narrative-scene>
      <div class="sticky">
        <svg class="graphic" data-scroll-svg viewBox="0 0 885 581" role="img" aria-label="Five product layers filling with orange as the page scrolls">
          <defs>
            <linearGradient id="bl-trace" x1="10" y1="264" x2="874" y2="264" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#FC4F1C" />
              <stop offset=".5" stop-color="#7E270E" />
              <stop offset="1" stop-color="#FC4F1C" />
            </linearGradient>
            <filter id="bl-glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="6" result="blur" />
              <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
          </defs>

          <path fill="#0E0E0E" stroke="#2D2D2D" stroke-width="2" d="M12 264V312L422 550H462L873 308V264L462 500H422L12 264Z" />
          <path fill="#0D0D0D" stroke="#2D2D2D" stroke-width="2" d="M442.5 6 873 264 442.5 522 12 264 442.5 6Z" />

          <g>
            <path class="bl-base-ring" d="M442.5 6 873 264 442.5 522 12 264 442.5 6Z" />
            <path class="bl-base-ring" d="M442.5 47 803 264 442.5 481 82 264 442.5 47Z" />
            <path class="bl-base-ring" d="M442.5 88 733 264 442.5 440 152 264 442.5 88Z" />
            <path class="bl-base-ring" d="M442.5 129 663 264 442.5 399 222 264 442.5 129Z" />
            <path class="bl-base-ring" d="M442.5 170 593 264 442.5 358 292 264 442.5 170Z" />
          </g>

          <g filter="url(#bl-glow)">
            <path class="bl-trace" data-trace="0" pathLength="1" d="M442.5 6 873 264 442.5 522 12 264 442.5 6Z" />
            <path class="bl-trace" data-trace="1" pathLength="1" d="M442.5 47 803 264 442.5 481 82 264 442.5 47Z" />
            <path class="bl-trace" data-trace="2" pathLength="1" d="M442.5 88 733 264 442.5 440 152 264 442.5 88Z" />
            <path class="bl-trace" data-trace="3" pathLength="1" d="M442.5 129 663 264 442.5 399 222 264 442.5 129Z" />
            <path class="bl-trace" data-trace="4" pathLength="1" d="M442.5 170 593 264 442.5 358 292 264 442.5 170Z" />
          </g>

          <path fill="#2E2E2E" d="M442.5 204 547 264 442.5 324 338 264 442.5 204Z" />
          <path class="bl-center-on" data-center-on fill="#FC4F1C" filter="url(#bl-glow)" d="M442.5 204 547 264 442.5 324 338 264 442.5 204Z" />
        </svg>
        <div class="label"><span data-progress>0</span>% complete</div>
      </div>
    </section>
    <footer class="outro"><p>The center stays lit when the sequence is complete.</p></footer>

    <script>
      const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
      const scene = document.querySelector('[data-narrative-scene]');
      const traces = [...document.querySelectorAll('[data-trace]')];
      const center = document.querySelector('[data-center-on]');
      const progressLabel = document.querySelector('[data-progress]');
      let ticking = false;

      function render() {
        const rect = scene.getBoundingClientRect();
        const scrollable = Math.max(1, scene.offsetHeight - window.innerHeight);
        const progress = clamp(-rect.top / scrollable);

        traces.forEach((trace, index) => {
          const start = index * 0.13;
          const end = start + 0.38;
          const local = clamp((progress - start) / (end - start));
          trace.style.strokeDashoffset = String(1 - local);
          trace.style.opacity = String(local);
        });

        const centerProgress = clamp((progress - 0.82) / 0.18);
        center.style.opacity = String(centerProgress);
        progressLabel.textContent = String(Math.round(progress * 100));
        ticking = false;
      }

      function requestRender() {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(render);
        }
      }

      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        traces.forEach((trace) => {
          trace.style.strokeDashoffset = '0';
          trace.style.opacity = '1';
        });
        center.style.opacity = '1';
        progressLabel.textContent = '100';
      } else {
        addEventListener('scroll', requestRender, { passive: true });
        addEventListener('resize', requestRender);
        render();
      }
    </script>
  </body>
</html>
